<script>
/* ---------- The template: MLA 9 core elements ---------- */
const CEL=['ti','co','ve','nu','pu','da','pg','lo'];
const CNAME={ti:'Title of container',co:'Other contributors',ve:'Version',nu:'Number',pu:'Publisher',da:'Publication date',pg:'Location: pages',lo:'Location: DOI or URL'};
const NAME={au:'Author',ti:'Title of source',od:'Original publication date',ac:'Date of access'};
CEL.forEach(e=>{NAME['c1.'+e]=CNAME[e];NAME['c2.'+e]=CNAME[e]+' (2nd container)'});
const PATHS=['au','ti','od',...CEL.map(e=>'c1.'+e),...CEL.map(e=>'c2.'+e),'ac'];
const TITLED=new Set(['ti','c1.ti','c2.ti']);
const WHY={au:'Who is responsible for the work? Check the title page or byline.',ti:'The title of the thing you are citing.',od:'',
 'c1.ti':'The larger whole that holds your source.','c1.co':'Someone besides the author whose role matters to this source.','c1.ve':'Which edition or version this is.',
 'c1.nu':'The volume and issue numbers.','c1.pu':'Who published it.','c1.da':'When it was published.','c1.pg':'Where the source sits inside its container: the page range.',
 'c1.lo':'Where a reader finds it online: the DOI or URL.','c2.ti':'The database or platform where you found the source.','c2.co':'Who put it on that platform.','c2.da':'When it went up on that platform.','c2.lo':'The address of the source on that platform.',ac:''};

/* ---------- The corpus. Every source is invented for practice; the keys follow the Purdue OWL and the MLA Style Center.
   Sorts: forms[0] is how the piece appears on the source. [text, note] attaches a correction note to a wrong form.
   In form text, _underscores_ mark a title inside a title: it takes the opposite of the surrounding style (italic in roman, roman in italic).
   Key slots: [sortId, acceptable form index or [indices], title style ('i' italics, 'q' quotation marks), optional?] ---------- */
const CAPS='Write it in normal capitals, not the capitals of the source’s design.';
const INV='Invert the first author’s name: last name, comma, first names.';
const SUBT='Include the subtitle, joined to the title with a colon.';

{name:'A book with one author',task:'Cite the whole book.',
 desk:'MLA doesn’t copy a title page’s design. It normalizes it: normal capitals, a colon before the subtitle, its own punctuation between elements. You supply that punctuation, a period or a comma after each element.',
 leaves:[

 sorts:{

 start:{htext:0,hstyle:1,halign:0,indent:0,spacing:0,gap:0,rh:0,order:[5,4,1,0,3,2]}}
];

/* ---------- Normalizing ---------- */
EX.forEach(ex=>{
  if(ex.kind==='page')return;
  for(const id in ex.sorts){const s=ex.sorts[id];s.f=s.f.map(x=>Array.isArray(x)?{t:x[0],n:x[1]}:{t:x})}
  ex.keys=ex.keys.map(k=>{const o={};for(const p in k){const [s,f,st,opt]=k[p];o[p]={s,f:Array.isArray(f)?f:[f],st:st||null,opt:!!opt}}return o});
});

/* ---------- Building an entry ---------- */
const QUOTES=/[’”]+$/;
function formText(ex,v){return ex.sorts[v.s].f[v.f].t}
function plainOf(t){return t.replace(/_/g,'')}
function startsLower(t){return /^[“‘"]*[a-z]/.test(plainOf(t))}
function baseSegs(ex,path,v){
  const t=formText(ex,v);
  const base=TITLED.has(path)&&v.st==='i';
  let segs=t.split('_').map((x,k)=>({t:x,i:(k%2?!base:base)?1:0})).filter(s=>s.t);
  if(TITLED.has(path)&&v.st==='q')segs=[{t:'“',i:0},...segs,{t:'”',i:0}];
  return segs;
}
function capFirst(segs){const s=segs.find(x=>x.t);if(!s)return;s.t=s.t.replace(/^([“‘"]*)([a-z])/,(m,a,b)=>a+b.toUpperCase())}
function applyPunct(segs,p){
  segs=segs.map(s=>({...s}));
  if(!p)return segs;
  let trail='',i=segs.length-1;
  while(i>=0){const m=segs[i].t.match(QUOTES);if(!m)break;trail=m[0]+trail;segs[i].t=segs[i].t.slice(0,-m[0].length);if(segs[i].t)break;i--}
  segs=segs.filter(s=>s.t);segs.push({t:p,i:0});if(trail)segs.push({t:trail,i:0});
  return segs;
}
function coreLast(ex,path,v){const t=baseSegs(ex,path,v).map(s=>s.t).join('').replace(QUOTES,'');return t.slice(-1)}
/* What MLA's template requires after and at the start of each element, given the elements present */
function template(ex,entry){
  const exp={};
  const set=(p,mark,first)=>{const v=entry[p];const ch=coreLast(ex,p,v);
    const pu=(ch==='?'||ch==='!')?'':(mark==='.'&&ch==='.')?'':mark;
    exp[p]={pu,cap:startsLower(formText(ex,v))?!!first:null}};
  ['au','ti','od'].forEach(p=>{if(entry[p])set(p,'.',false)});
  for(const c of['c1','c2']){const els=CEL.map(e=>c+'.'+e).filter(p=>entry[p]);els.forEach((p,i)=>set(p,i===els.length-1?'.':',',i===0))}
  if(entry.ac)set('ac','.',false);
  return exp;
}
function unitSegs(ex,p,v,pu,cap){let s=baseSegs(ex,p,v);if(cap)capFirst(s);return applyPunct(s,pu)}
function orderOf(entry){return PATHS.filter(p=>entry[p])}
function assemble(ex,entry,exp){
  const out=[];
  orderOf(entry).forEach((p,i)=>{const v=entry[p];const pu=exp?exp[p].pu:(v.pu||'');const cap=exp?!!exp[p].cap:!!v.cap;
    if(i)out.push({t:' ',i:0});out.push(...unitSegs(ex,p,v,pu,cap))});
  return out;
}
function assembleKey(ex,e){return assemble(ex,e,template(ex,e))}
function segsHTML(segs){return segs.map(s=>s.i?'<i>'+esc(s.t)+'</i>':esc(s.t)).join('')}
function segsPlain(segs){return segs.map(s=>s.i?'*'+s.t+'*':s.t).join('').replace(/\*\*/g,'')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function chipHTML(t){return t.split('_').map((x,k)=>k%2?'<i>'+esc(x)+'</i>':esc(x)).join('')}

/* ---------- Checking ---------- */
function keyEntryFor(key,entry){
  const e={};
  for(const p in key){const k=key[p];const v=entry[p];
    if(k.opt&&!v)continue;
    const f=(v&&v.s===k.s&&k.f.includes(v.f))?v.f:k.f[0];
    e[p]={s:k.s,f,st:k.st};}
  return e;
}
function check(ex,entry){
  let best=null;
  ex.keys.forEach((key,ki)=>{
    const errs=[];const exp=template(ex,keyEntryFor(key,entry));
    for(const p of PATHS){
      const v=entry[p],k=key[p];
      if(!k){if(v)errs.push({p,type:'extra',v});continue}
      if(!v){if(!k.opt)errs.push({p,type:'missing',k});continue}
      if(v.s!==k.s){errs.push({p,type:'wrongsort',v,k});continue}
      let ok=true;
      if(!k.f.includes(v.f)){errs.push({p,type:'form',v,k});ok=false}
      if(k.st&&v.st!==k.st){errs.push({p,type:'style',v,k});ok=false}
      if(!ok)continue;
      const x=exp[p];
      if((v.pu||'')!==x.pu)errs.push({p,type:'punct',v,x});
      if(x.cap!==null&&!!v.cap!==x.cap)errs.push({p,type:'cap',v,x});
    }
    if(!best||errs.length<best.errs.length)best={ki,key,errs};
  });
  return best;
}
function whereBelongs(key,sid){for(const p in key)if(key[p].s===sid)return p;return null}
function slotName(p){return NAME[p]}
const PUN={'.':'a period',',':'a comma','':'nothing'};
function message(ex,key,e){
  const sorts=ex.sorts;const why=p=>(ex.why&&ex.why[p])||WHY[p];
  const label=sid=>'“'+plainOf(sorts[sid].f[0].t)+'”';
  if(e.type==='missing')return{h:'Missing: '+slotName(e.p),b:why(e.p)};
  if(e.type==='extra'||e.type==='wrongsort'){
    const sid=e.v.s,s=sorts[sid],home=whereBelongs(key,sid);
    let b;
    if(s.no)b=s.no;else if(home)b='This belongs in '+slotName(home)+'.';else b='This doesn’t belong in this entry.';
    if(e.type==='wrongsort')b+=' '+slotName(e.p)+' needs something else: '+why(e.p).charAt(0).toLowerCase()+why(e.p).slice(1);
    return{h:slotName(e.p)+': '+label(sid),b};
  }
  if(e.type==='form'){const n=sorts[e.v.s].f[e.v.f].n;return{h:slotName(e.p)+': right information, wrong form',b:n||'Write it in a different form here.'}}
  if(e.type==='style')return{h:slotName(e.p)+': title styling',b:e.k.st==='r'?'A plain section label like Introduction, Preface, Foreword, or Afterword takes neither italics nor quotation marks.':e.k.st==='i'?'This title stands on its own (a book, journal, website, film, or platform), so it is set in italics, however the source prints it.':'This title is part of a larger whole, so it goes in quotation marks, however the source prints it.'};
  if(e.type==='punct'){
    const x=e.x.pu,c=coreLast(ex,e.p,e.v),p=e.p;let b;
    if(x===''&&c==='.')b='This element already ends with a period, and MLA doesn’t double it. Add nothing after it.';
    else if(x==='')b='The title’s own punctuation closes this element. Add nothing after it.';
    else if(x===',')b='Elements inside a container are separated by commas.';
    else if(p==='au')b='The author element ends with a period.';
    else if(p==='ti')b='The title of the source ends with a period.';
    else if(p==='od')b='The original date stands alone after the title and ends with a period.';
    else if(p==='ac')b='The date of access ends with a period, and so does the entry.';
    else b='This is the last element in its container, so it ends with a period.'+(orderOf(keyEntryFor(key,{})).slice(-1)[0]===p?' Every entry ends with a period.':'');
    if(x&&/[’”]$/.test(baseSegs(ex,p,e.v).map(s=>s.t).join('')))b+=' The mark goes inside the closing quotation marks.';
    return{h:slotName(p)+': followed by '+PUN[e.v.pu||''],b};
  }
  if(e.type==='cap'){const t=plainOf(formText(ex,e.v));
    return{h:slotName(e.p)+': first letter',b:e.x.cap?'This element comes right after a period, so its first word takes a capital: '+t.charAt(0).toUpperCase()+t.slice(1)+'.':'This element comes after a comma, so it stays lowercase: '+t+'.'}}
}

/* ---------- Comparison view ---------- */
const PUNCT='.,:;?!“”‘’';
function tokens(segs){
  const out=[];let sp=false;
  for(const s of segs)for(const c of s.t){
    if(/\s/.test(c)){sp=true;continue}
    const last=out[out.length-1];
    if(PUNCT.includes(c)){out.push({t:c,i:s.i,sp});sp=false;continue}
    if(last&&!sp&&last.i===s.i&&!PUNCT.includes(last.t)){last.t+=c;continue}
    out.push({t:c,i:s.i,sp});sp=false;
  }
  return out;
}
function diff(a,b){
  const n=a.length,m=b.length,K=t=>t.t+'|'+t.i;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=K(a[i])===K(b[j])?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const ops=[];let i=0,j=0;
  while(i<n&&j<m){if(K(a[i])===K(b[j])){ops.push(['=',a[i],b[j]]);i++;j++}else if(L[i+1][j]>=L[i][j+1]){ops.push(['-',a[i]]);i++}else{ops.push(['+',b[j]]);j++}}
  while(i<n)ops.push(['-',a[i++]]);while(j<m)ops.push(['+',b[j++]]);

}
function tokHTML(t,cls){let h=esc(t.t);if(t.i)h='<i>'+h+'</i>';if(cls)h='<span class="'+cls+'">'+h+'</span>';return (t.sp?' ':'')+h}

/* ---------- Key sheet expansion ---------- */
function expandKey(key){
  const paths=Object.keys(key);const res=[];
  const rec=(i,e)=>{
    if(i===paths.length){res.push(Object.assign({},e));return}
    const p=paths[i],k=key[p];
    if(k.opt)rec(i+1,e);
    for(const f of k.f){e[p]={s:k.s,f,st:k.st};rec(i+1,e);delete e[p]}
  };
  rec(0,{});return res;
}

/* ---------- The Works Cited page ---------- */
function pageEntries(ex){return ex.entries.map(([xi,ki])=>{const src=EX[xi];const e=expandKey(src.keys[ki]).filter(z=>Object.keys(z).length===Object.keys(src.keys[ki]).filter(p=>!src.keys[ki][p].opt).length)[0];return assembleKey(src,e)})}
function sortKey(segs){return segsPlain(segs).replace(/[*“”‘’"]/g,'').replace(/^(the|an|a)\s+/i,'').toLowerCase()}
function checkPage(ex,st){
  const errs=[];
  ex.ctl.forEach(c=>{if(st[c.id]!==c.key)errs.push({h:c.label+': '+c.opts[st[c.id]],b:c.note})});
  const ents=pageEntries(ex);const want=ents.map((s,i)=>i).sort((a,b)=>sortKey(ents[a])<sortKey(ents[b])?-1:1);
  if(st.order.join()!==want.join()){
    let b='Alphabetize entries by their first element, ignoring A, An, and The at the start.';
    const ti=ents.findIndex(s=>/^the\s/i.test(segsPlain(s).replace(/[*“]/g,'')));
    if(ti>=0&&st.order.indexOf(ti)!==want.indexOf(ti))b+=' An entry that begins with The files under the next word: '+plainOf(segsPlain(ents[ti]).replace(/\*/g,'').split('.')[0])+' goes under H.';
    errs.push({h:'Order of entries',b});
  }
  return {errs,want};
}

/* ---------- UI ---------- */
const store={get(){try{return JSON.parse(localStorage.getItem('core-elements-v2'))||{}}catch(e){return{}}},set(v){try{localStorage.setItem('core-elements-v2',JSON.stringify(v))}catch(e){}}};
const S={view:'bench',ex:0,entries:EX.map(ex=>ex.kind==='page'?JSON.parse(JSON.stringify(ex.start)):{}),hand:null,open:null,proof:null,collate:false,c2:false,done:new Set(store.get().done||[])};

/* ---------- Completion slip ----------
   The code mixes the name, score, total, and date with a phrase kept in this page. Editing any part of a slip breaks its code.
   It stops casual copying and editing; someone who reads this source could forge one. */
const SALT='sabine-pass-ferry-1897-xxiii-iv';
const MON=['Jan.','Feb.','Mar.','Apr.','May','June','July','Aug.','Sept.','Oct.','Nov.','Dec.'];
function today(){const d=new Date();return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()}
function normName(n){return String(n).trim().replace(/\s+/g,' ').toLowerCase()}
function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}

  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let x=cyrb53(SALT+'|'+normName(name)+'|'+n+'/'+total+'|'+date.trim(),7),s='';
  for(let i=0;i<8;i++){s+=A[x%32];x=Math.floor(x/32)}

}
function slipLine(name){const n=S.done.size,t=EX.length,d=today();return `Core Elements · ${name.trim()} · ${n}/${t} · ${d} · ${slipCode(name,n,t,d)}`}
function slipHTML(){

  <div><div class="label">Your slip</div><div class="slip" style="margin-top:6px"><div class="hang" id="slipText" style="margin-top:4px;padding-left:0;text-indent:0">${name.trim()?esc(slipLine(name)):'<span class="empty">Type your name to make your slip.</span>'}</div></div></div>
  <div class="actions"><button class="btn" id="copySlip">Copy the slip</button></div><p class="sub" id="copyMsg" style="margin:0">Paste the whole line into the D2L assignment. Don’t edit it: any change breaks the code.</p></section></div>`;
}
function verifyHTML(){
  return `<div class="prose" style="margin-top:18px"><span class="label">For the instructor</span><h2 style="font-family:var(--f-book);font-weight:400;margin:4px 0 10px">Check completion slips</h2><p>Paste one slip or a whole column of them, copied from D2L. Each slip is checked against its own name, score, and date.</p>

function verifySlips(text){
  const re=/Core Elements\s*[·•|]\s*(.+?)\s*[·•|]\s*(\d+)\s*\/\s*(\d+)\s*[·•|]\s*(.+?)\s*[·•|]\s*([A-Z0-9]{4}-[A-Z0-9]{4})/gi;const rows=[];let m;

    const n=res.errs.length;let extra='';
    if(n&&!S.collate)extra=`<div><button class="btn ghost" id="collate">Compare with the correct entry</button></div>`;
    if(S.collate||!n){
      const a=tokens(segs),b=tokens(assembleKey(ex,keyEntryFor(res.key,entry)));
      const ops=diff(a,b);
      const yours=ops.filter(o=>o[0]!=='+').map(o=>tokHTML(o[1],o[0]==='-'?'x':'')).join('');
      const copy=ops.filter(o=>o[0]!=='-').map(o=>tokHTML(o[0]==='='?o[2]:o[1],o[0]==='+'?'a':'')).join('');
      extra+=n?`<div class="coll"><div class="w"><span>Yours</span><div>${yours}</div></div><div class="w"><span>Correct</span><div>${copy}</div></div></div><p class="sub" style="margin:0">Struck through: only in your entry. Underlined: what the correct entry has instead.</p>`:`<div class="coll"><div class="w"><span>Entry</span><div>${copy}</div></div></div>`;
    }
    proof=resultHTML(n,res.errs.map(e=>message(ex,res.key,e)),extra);
  }
  return stripHTML()+`<div class="grid"><section>${headHTML(ex,'Tap a piece of the source, then tap the element where it belongs. Tap a filled element to choose how it is written and what punctuation follows it.')}<div class="bench">${leaves}</div></section>
  <section class="panel stick" aria-label="Template of core elements">
   ${group('Source',['au','ti'])}
   ${group('Container',CEL.map(e=>'c1.'+e))}
   ${showC2?group('Second container',CEL.map(e=>'c2.'+e)):`<div><button class="linkbtn" id="addc2">+ Add a second container (a database or platform)</button></div>`}
   ${group('Optional elements',['od','ac'])}
   <div class="slip"><div class="hd">Works Cited</div><div class="hang">${segs.length?segsHTML(segs):'<span class="empty">Your entry builds here as you fill in the template.</span>'}</div></div>
   ${actionsHTML()}${proof}
  </section></div>`;
}
function pageHTML(){
  const ex=EX[S.ex],st=S.entries[S.ex];const ents=pageEntries(ex);
  const o=k=>ex.ctl.find(c=>c.id===k).opts[st[k]];
  const rh=['',`<div class="rh r">${ex.last} ${ex.pageNo}</div>`,`<div class="rh l">${ex.last} ${ex.pageNo}</div>`,`<div class="rh r">Page ${ex.pageNo}</div>`,`<div class="rh r">${ex.last}, p. ${ex.pageNo}</div>`][st.rh];
  const hs=['','font-weight:700;','font-style:italic;','text-decoration:underline;','text-transform:uppercase;'][st.hstyle];
  const lh=st.spacing?2:1.25;
  const ind=['','text-indent:.5in;','padding-left:.5in;text-indent:-.5in;'][st.indent];
  const gap=st.gap===0?`margin-bottom:${lh}em;`:'';
  const paper=`<div class="paperwrap"><div class="paper">${rh}<h5 style="${hs}text-align:${st.halign?'center':'left'};line-height:${lh}">${esc(o('htext'))}</h5>${st.order.map(i=>`<p class="entry" style="line-height:${lh};${ind}${gap}">${segsHTML(ents[i])}</p>`).join('')}</div></div>`;
  const res=S.proof;
  const ctl=ex.ctl.map(c=>`<div><div class="label">${esc(c.label)}</div><div class="row">${c.opts.map((x,i)=>`<button class="chip plain" data-pg="${c.id}" data-v="${i}" aria-pressed="${st[c.id]===i}">${esc(x)}</button>`).join('')}</div></div>`).join('');
  const ord=`<div><div class="label">Order of entries</div><ol class="order">${st.order.map((i,k)=>`<li><span>${segsHTML(ents[i])}</span><button data-mv="${k}" data-d="-1" aria-label="Move up" ${k===0?'disabled':''}>↑</button><button data-mv="${k}" data-d="1" aria-label="Move down" ${k===st.order.length-1?'disabled':''}>↓</button></li>`).join('')}</ol></div>`;
  return stripHTML()+`<div class="grid"><section>${headHTML(ex,'Change the settings on the right and watch the page.')}${paper}</section><section class="panel ctl">${ctl}${ord}${actionsHTML()}${res?resultHTML(res.errs.length,res.errs):''}</section></div>`;
}
function keysHTML(){
  return `<div class="keys"><div class="prose"><h2 style="font-family:var(--f-book);font-weight:400">Key sheet</h2><p>Every entry the checker accepts, generated by the same code that grades students, punctuation and capitals included. Proof these against the <i>MLA Handbook</i> before the tool goes to a class. Notes mark the places where a judgment call was made.</p><p>Rules taken from the Purdue OWL MLA pages (<a href="https://owl.purdue.edu/owl/research_and_citation/mla_style/mla_formatting_and_style_guide/mla_formatting_and_style_guide.html" target="_blank" rel="noopener">overview</a>, <a href="https://owl.purdue.edu/owl/research_and_citation/mla_style/mla_formatting_and_style_guide/mla_works_cited_page_books.html" target="_blank" rel="noopener">books</a>, <a href="https://owl.purdue.edu/owl/research_and_citation/mla_style/mla_formatting_and_style_guide/mla_works_cited_electronic_sources.html" target="_blank" rel="noopener">electronic sources</a>, <a href="https://owl.purdue.edu/owl/research_and_citation/mla_style/mla_formatting_and_style_guide/mla_works_cited_other_common_sources.html" target="_blank" rel="noopener">other sources</a>, <a href="https://owl.purdue.edu/owl/research_and_citation/mla_style/mla_formatting_and_style_guide/mla_abbreviations.html" target="_blank" rel="noopener">abbreviations</a>, <a href="https://owl.purdue.edu/owl/research_and_citation/mla_style/mla_formatting_and_style_guide/mla_works_cited_page_basic_format.html" target="_blank" rel="noopener">Works Cited format</a>, <a href="https://owl.purdue.edu/owl/research_and_citation/mla_style/mla_formatting_and_style_guide/mla_general_format.html" target="_blank" rel="noopener">general format</a>) and the MLA Style Center (<a href="https://style.mla.org/page-range-and-doi/" target="_blank" rel="noopener">page range and DOI</a>, <a href="https://style.mla.org/urls-some-practical-advice/" target="_blank" rel="noopener">URLs</a>, <a href="https://style.mla.org/italics-quote-marks-book-titles/" target="_blank" rel="noopener">titles within titles</a>, <a href="https://style.mla.org/closer-look-at-mla-style/" target="_blank" rel="noopener">a closer look</a>, <a href="https://style.mla.org/works-cited/citations-by-format/movies-videos-and-television-shows/" target="_blank" rel="noopener">films and videos</a>). Where the OWL’s own examples disagree with each other, the MLA Style Center wins. All sources are invented for practice.</p></div>`+
  EX.map((ex,i)=>{
    if(ex.kind==='page'){const ents=pageEntries(ex);const want=checkPage(ex,{...ex.start}).want;
      return `<article><span class="label">Exercise ${i+1}</span><h3>${esc(ex.name)}</h3>${ex.ctl.map(c=>`<p style="margin:2px 0"><b>${esc(c.label)}:</b> ${esc(c.opts[c.key])}</p>`).join('')}<p style="margin:10px 0 2px"><b>Order:</b></p>${want.map(k=>`<p class="ent">${segsHTML(ents[k])}</p>`).join('')}</article>`}
    const all=[];ex.keys.forEach(k=>expandKey(k).forEach(e=>all.push(segsHTML(assembleKey(ex,e)))));
    return `<article><span class="label">Exercise ${i+1}</span><h3>${esc(ex.name)}</h3>${[...new Set(all)].map(h=>`<p class="ent">${h}</p>`).join('')}${ex.flag?`<div class="flag">${esc(ex.flag)}</div>`:''}</article>`;
  }).join('')+'</div>';
}
function renderHand(){
  const h=$('#hand');
  if(S.view!=='bench'||!S.hand){h.hidden=true;return}
  const s=EX[S.ex].sorts[S.hand];
  h.hidden=false;h.innerHTML=`<span>Selected</span><q>${esc(plainOf(s.f[0].t))}</q><span>Tap the element where it belongs.</span><button id="drop">Cancel</button>`;
}
function saveDone(){store.set({done:[...S.done],name:S.name||''})}
function reset(){S.hand=null;S.open=null;S.proof=null;S.collate=false;S.c2=false}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,[data-s]');if(!t)return;
  const ex=EX[S.ex],entry=S.entries[S.ex];
  if(t.id==='vBench'){S.view='bench';S.hand=null;return render()}
  if(t.id==='vSlip'){S.view='slip';S.hand=null;return render()}
  if(t.id==='copySlip'){const txt=S.name&&S.name.trim()?slipLine(S.name):'';const msg=$('#copyMsg');
    if(!txt){msg.textContent='Type your name first.';return}
    const sel=()=>{const r=document.createRange();r.selectNodeContents($('#slipText'));const s=getSelection();s.removeAllRanges();s.addRange(r);msg.textContent='Selected. Copy it with your device’s Copy command.'};
    try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent='Copied. Paste it into the D2L assignment.'},sel)}catch(e){sel()}
    return}
  if(t.id==='verifyGo'){S.verifyIn=$('#verifyIn').value;S.verifyOut=verifySlips(S.verifyIn);return render()}
  if(t.id==='drop'){S.hand=null;return render()}
  if(t.dataset.go!=null){S.ex=+t.dataset.go;S.view='bench';reset();render();window.scrollTo({top:0});return}
  if(t.id==='next'){S.ex++;reset();render();window.scrollTo({top:0});return}
  if(t.id==='clear'){S.entries[S.ex]=ex.kind==='page'?JSON.parse(JSON.stringify(ex.start)):{};reset();return render()}
  if(ex.kind==='page'){
    if(t.dataset.pg){entry[t.dataset.pg]=+t.dataset.v;S.proof=null;return render()}
    if(t.dataset.mv!=null){const k=+t.dataset.mv,d=+t.dataset.d,o=entry.order;[o[k],o[k+d]]=[o[k+d],o[k]];S.proof=null;return render()}
    if(t.id==='pull'){S.proof=checkPage(ex,entry);if(!S.proof.errs.length){S.done.add(S.ex);saveDone()}return render()}
    return;
  }
  if(t.dataset.s){S.hand=S.hand===t.dataset.s?null:t.dataset.s;S.open=null;return render()}
  if(t.dataset.slot){
    const p=t.dataset.slot;
    if(S.hand){
      for(const q in entry)if(entry[q].s===S.hand)delete entry[q];
      entry[p]={s:S.hand,f:0,st:'r',pu:'',cap:false};S.hand=null;S.open=p;S.proof=null;S.collate=false;
    }else if(entry[p])S.open=S.open===p?null:p;
    return render();
  }
  const ch=()=>{S.proof=null;S.collate=false;render()};
  if(t.dataset.form!=null&&S.open){entry[S.open].f=+t.dataset.form;return ch()}
  if(t.dataset.st&&S.open){entry[S.open].st=t.dataset.st;return ch()}
  if(t.dataset.pu!=null&&S.open){entry[S.open].pu=t.dataset.pu;return ch()}
  if(t.dataset.cap!=null&&S.open){entry[S.open].cap=t.dataset.cap==='1';return ch()}
  if(t.dataset.rm){delete entry[t.dataset.rm];S.open=null;return ch()}
  if(t.id==='addc2'){S.c2=true;return render()}
  if(t.id==='pull'){S.proof=check(ex,entry);S.open=null;S.collate=false;if(!S.proof.errs.length){S.done.add(S.ex);saveDone()}return render()}
  if(t.id==='collate'){S.collate=true;return render()}
});
document.addEventListener('keydown',ev=>{const t=ev.target;if(t.dataset&&t.dataset.s&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();t.click()}});
document.addEventListener('input',ev=>{if(ev.target.id==='stuName'){S.name=ev.target.value;store.set({done:[...S.done],name:S.name});const el=$('#slipText');if(el)el.innerHTML=S.name.trim()?esc(slipLine(S.name)):'<span class="empty">Type your name to make your slip.</span>'}});
window.addEventListener('hashchange',()=>{route();render()});
S.name=store.get().name||'';
if(typeof document!=='undefined'&&document.getElementById('app')){route();render()}
</script>

</body></html>
